name: backoffice

on:
  push:
    branches: [develop, main]
    paths: ["frontend/backoffice/**", ".github/workflows/backoffice.yml"]
  pull_request:
    paths: ["frontend/backoffice/**", ".github/workflows/backoffice.yml"]

defaults:
  run:
    working-directory: frontend/backoffice

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: https://dev-api.nidnoitravelv2.com/api/v1
      VITE_APP_NAME: nidnoi Back-Office
      VITE_APP_ENV: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/backoffice/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
