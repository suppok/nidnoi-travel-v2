name: customer

on:
  push:
    branches: [develop, main]
    paths: ["frontend/customer/**", ".github/workflows/customer.yml"]
  pull_request:
    paths: ["frontend/customer/**", ".github/workflows/customer.yml"]

defaults:
  run:
    working-directory: frontend/customer

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PUBLIC_API_BASE_URL: https://dev-api.nidnoitravelv2.com/api/v1
      PUBLIC_SITE_URL: https://dev.nidnoitravelv2.com
      PUBLIC_SITE_ENV: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/customer/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
