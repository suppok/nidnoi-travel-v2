# Non-secret settings. Secrets come from environment variables (config/local.env locally, Railway when deployed).

server:
  readTimeout: 15s
  writeTimeout: 30s
  bodyLimitMB: 12 # Fiber default is 4 MB; uploads are up to 10 MB
  clientIPHeader: CF-Connecting-IP # real client IP behind Cloudflare; falls back to the socket address

database:
  maxOpenConns: 10
  maxIdleConns: 5
  connMaxLifetime: 30m

auth:
  accessTokenTTL: 15m
  refreshTokenTTL: 720h # 30 days, "remember me" (persistent cookie)
  sessionRefreshTokenTTL: 12h # without "remember me" (session cookie)
  refreshReuseGrace: 30s # a just-rotated token reused within this window is a benign race, not theft
  refreshCookieName: nidnoi_refresh
  bcryptCost: 12

permission:
  modelPath: config/permissions/model.conf
  policyPath: config/permissions/policy.csv

tourCode:
  prefix: NIDN # code = prefix + 6-digit zero-padded number, e.g. NIDN000001

revalidation:
  quiet: 3m # fire once no change has arrived for this long
  maxWait: 15m # ...but at most this long after the first pending change
  dailyAt: "00:05" # Thailand time; "upcoming" periods move with the calendar. "" disables

media:
  maxUploadMB: 10
  maxMegapixels: 50
  webpQuality: 82
  decodeConcurrency: 2
  orphanGracePeriod: 168h # 7 days
  sweepInterval: 1h

rateLimit:
  login:
    max: 10
    window: 1m
  booking: # POST /bookings/public, per client IP
    max: 5
    window: 10m
