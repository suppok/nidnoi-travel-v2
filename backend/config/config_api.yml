# Non-secret settings. Secrets come from environment variables (config/local.env locally, Railway when deployed).

server:
  readTimeout: 15s
  writeTimeout: 30s
  # Fiber default is 4 MB. Media uploads are up to 10 MB; tour PDFs for AI prefill up to ai.maxPdfMB.
  # Fiber applies one limit to every route.
  bodyLimitMB: 52
  clientIPHeader: CF-Connecting-IP # real client IP behind Cloudflare; falls back to the socket address

database:
  # The Supabase session pooler gives each client connection its own server slot (pool_size 15 on
  # the Free org) and local + dev share one database, so keep every instance small and let idle
  # connections go.
  maxOpenConns: 5
  maxIdleConns: 2
  connMaxLifetime: 30m
  connMaxIdleTime: 5m

auth:
  accessTokenTTL: 15m
  refreshTokenTTL: 720h # 30 days, "remember me" (persistent cookie)
  sessionRefreshTokenTTL: 12h # without "remember me" (session cookie)
  refreshReuseGrace: 30s # a just-rotated token reused within this window is a benign race, not theft
  refreshCookieName: nidnoi_refresh
  bcryptCost: 12

permission:
  modelPath: config/permissions/model.conf
  policyPath: config/permissions/policy.csv

tourCode:
  prefix: NIDN # code = prefix + 6-digit zero-padded number, e.g. NIDN000001

revalidation:
  quiet: 3m # fire once no change has arrived for this long
  maxWait: 15m # ...but at most this long after the first pending change
  dailyAt: "00:05" # Thailand time; "upcoming" periods move with the calendar. "" disables

media:
  maxUploadMB: 10
  maxDocumentMB: 50 # tour PDFs (purpose tour-pdf), so the PDF read by AI prefill fits. Below server.bodyLimitMB
  maxMegapixels: 50
  webpQuality: 82
  decodeConcurrency: 2
  orphanGracePeriod: 168h # 7 days
  sweepInterval: 1h

rateLimit:
  login:
    max: 10
    window: 1m
  booking: # POST /bookings/public, per client IP
    max: 5
    window: 10m

mail:
  # From is MAIL_FROM (per environment). Reply-To/Cc of wholesale emails: app config WHOLESALE_EMAIL.
  httpTimeout: 10s
  outbox:
    tickInterval: 10s # how often the sender picks due emails
    batchSize: 20
    maxAttempts: 5 # then the email is failed; resend from the backoffice

ai:
  # Tour program prefill from a PDF (Claude API). Key, model and on/off: app config AI_SETTINGS (admin page).
  requestTimeout: 180s # one extraction, retries included
  maxConcurrent: 2 # extractions at once; each holds the PDF in memory
  maxRetries: 3 # 429 / 529 only
  maxPdfMB: 50 # hard cap; the admin setting maxPdfSizeMb can only be lower. Below server.bodyLimitMB
  jobTTL: 30m # how long a finished result waits for the backoffice to fetch it
