info:
  contact: {}
  title: nidnoi travel API
  version: "1.0"
paths:
  /airlines:
    post:
      consumes:
      - application/json
      description: The code (IATA, or ICAO when there is none) is stored uppercase.
        The logo must be uploaded first through POST /media/upload (purpose airline-logo).
      parameters:
      - description: Airline
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/backend_pkg_modules_airline_models.AirlineCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_pkg_modules_airline_models.AirlineCreateResponse'
        "400":
          description: VALIDATION
          schema:
            additionalProperties: true
            type: object
        "409":
          description: CODE_TAKEN, REF_ID_TAKEN
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create an airline
      tags:
      - airlines
    put:
      consumes:
      - application/json
      description: Replaces every editable field.
      parameters:
      - description: Airline
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/backend_pkg_modules_airline_models.AirlineUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_pkg_modules_airline_models.AirlineUpdateResponse'
        "400":
          description: VALIDATION
          schema:
            additionalProperties: true
            type: object
        "404":
          description: NOT_FOUND
          schema:
            additionalProperties: true
            type: object
        "409":
          description: CODE_TAKEN, REF_ID_TAKEN
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update an airline
      tags:
      - airlines
  /airlines/{id}:
    get:
      parameters:
      - description: Airline ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_pkg_modules_airline_models.AirlineGetResponse'
        "404":
          description: NOT_FOUND
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get an airline
      tags:
      - airlines
  /airlines/list:
    post:
      consumes:
      - application/json
      parameters:
      - description: Filter
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/backend_pkg_modules_airline_models.AirlineListRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_pkg_modules_airline_models.AirlineListResponse'
      security:
      - BearerAuth: []
      summary: List airlines
      tags:
      - airlines
  /airlines/status:
    put:
      consumes:
      - application/json
      parameters:
      - description: Status
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/backend_pkg_modules_airline_models.AirlineUpdateStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'data: null'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: NOT_FOUND
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Soft-delete or restore an airline
      tags:
      - airlines
  /auth/login:
    post:
      consumes:
      - application/json
      description: Returns a short-lived access token and sets the HttpOnly refresh
        cookie. Rate-limited.
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/backend_pkg_modules_auth_models.AuthLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_pkg_modules_auth_models.AuthLoginResponse'
        "401":
          description: INVALID_CREDENTIALS
          schema:
            additionalProperties: true
            type: object
        "429":
          description: RATE_LIMITED
          schema:
            additionalProperties: true
            type: object
      summary: Log in (backoffice)
      tags:
      - auth
  /auth/logout:
    post:
      description: Revokes the refresh cookie's token and clears the cookie. No access
        token needed.
      produces:
      - application/json
      responses:
        "200":
          description: 'data: null'
          schema:
            additionalProperties: true
            type: object
      summary: Log out
      tags:
      - auth
  /auth/me:
    get:
      description: Roles and the union of their permission codes. Allowed while a
        password change is pending.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_pkg_modules_auth_models.AuthMeResponse'
        "401":
          description: UNAUTHENTICATED
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - auth
  /auth/password:
    put:
      consumes:
      - application/json
      description: Clears mustChangePassword and signs out every other session.
      parameters:
      - description: Passwords
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/backend_pkg_modules_auth_models.AuthChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'data: null'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: VALIDATION, INVALID_PASSWORD
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Change own password
      tags:
      - auth
  /auth/refresh:
    post:
      description: Uses and rotates the refresh cookie. 401 clears the cookie.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_pkg_modules_auth_models.AuthRefreshResponse'
        "401":
          description: UNAUTHENTICATED
          schema:
            additionalProperties: true
            type: object
      summary: Refresh the access token
      tags:
