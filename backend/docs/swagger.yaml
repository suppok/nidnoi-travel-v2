info:
  contact: {}
  title: nidnoi travel API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Returns a short-lived access token and sets the HttpOnly refresh
        cookie. Rate-limited.
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/backend_pkg_modules_auth_models.AuthLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_pkg_modules_auth_models.AuthLoginResponse'
        "401":
          description: INVALID_CREDENTIALS
          schema:
            additionalProperties: true
            type: object
        "429":
          description: RATE_LIMITED
          schema:
            additionalProperties: true
            type: object
      summary: Log in (backoffice)
      tags:
      - auth
  /auth/logout:
    post:
      description: Revokes the refresh cookie's token and clears the cookie. No access
        token needed.
      produces:
      - application/json
      responses:
        "200":
          description: 'data: null'
          schema:
            additionalProperties: true
            type: object
      summary: Log out
      tags:
      - auth
  /auth/me:
    get:
      description: Roles and the union of their permission codes. Allowed while a
        password change is pending.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_pkg_modules_auth_models.AuthMeResponse'
        "401":
          description: UNAUTHENTICATED
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - auth
  /auth/password:
    put:
      consumes:
      - application/json
      description: Clears mustChangePassword and signs out every other session.
      parameters:
      - description: Passwords
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/backend_pkg_modules_auth_models.AuthChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'data: null'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: VALIDATION, INVALID_PASSWORD
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Change own password
      tags:
      - auth
  /auth/refresh:
    post:
      description: Uses and rotates the refresh cookie. 401 clears the cookie.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_pkg_modules_auth_models.AuthRefreshResponse'
        "401":
          description: UNAUTHENTICATED
          schema:
            additionalProperties: true
            type: object
      summary: Refresh the access token
      tags:
      - auth
  /cities:
    post:
      consumes:
      - application/json
      description: The slug is locked after create. The country must be active.
      parameters:
      - description: City
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/backend_pkg_modules_city_models.CityCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_pkg_modules_city_models.CityCreateResponse'
        "400":
          description: VALIDATION
          schema:
            additionalProperties: true
            type: object
        "409":
          description: SLUG_TAKEN, REF_ID_TAKEN
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create a city
      tags:
      - cities
    put:
      consumes:
      - application/json
      parameters:
      - description: City
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/backend_pkg_modules_city_models.CityUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_pkg_modules_city_models.CityUpdateResponse'
        "400":
          description: VALIDATION
          schema:
            additionalProperties: true
            type: object
        "404":
          description: NOT_FOUND
          schema:
            additionalProperties: true
            type: object
        "409":
          description: REF_ID_TAKEN
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update a city's country, display fields and ref ID (not the slug)
      tags:
      - cities
  /cities/{id}:
    get:
      parameters:
      - description: City ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_pkg_modules_city_models.CityGetResponse'
        "404":
          description: NOT_FOUND
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get a city
      tags:
      - cities
  /cities/list:
    post:
      consumes:
      - application/json
      parameters:
      - description: Filter
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/backend_pkg_modules_city_models.CityListRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_pkg_modules_city_models.CityListResponse'
      security:
      - BearerAuth: []
      summary: List cities
      tags:
      - cities
  /cities/status:
    put:
      consumes:
      - application/json
      description: Restoring requires the city's country to be active.
      parameters:
      - description: Status
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/backend_pkg_modules_city_models.CityUpdateStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'data: null'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 'VALIDATION (countryId: country deleted)'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: NOT_FOUND
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Soft-delete or restore a city
      tags:
      - cities
  /countries:
    post:
      consumes:
      - application/json
      description: The slug is locked after create.
      parameters:
      - description: Country
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/backend_pkg_modules_country_models.CountryCreateRequest'
      produces:
